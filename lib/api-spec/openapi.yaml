openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Product category operations
  - name: products
    description: Product operations
  - name: netsuite
    description: NetSuite sync operations
paths:
  /cases:
    post:
      operationId: submitIssueReport
      summary: Create a NetSuite case with captured diagnostic context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueReportInput"
      responses:
        "200":
          description: NetSuite case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueReportResult"
  /issues/screenshot-upload:
    post:
      operationId: requestIssueScreenshotUpload
      summary: Request a private screenshot upload for a report
      responses:
        "200":
          description: Signed upload location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueScreenshotUpload"
  /admin/issues:
    get:
      operationId: getAdminIssues
      summary: Reported issues and live NetSuite case statuses
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Issue report history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIssueList"
  /admin/issues/{id}/screenshot:
    get:
      operationId: getIssueScreenshot
      summary: Admin-only access to a report screenshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Screenshot bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
  /dev/sync/timing:
    get:
      operationId: getSyncTiming
      summary: Actual next scheduled NetSuite sync time
      responses:
        "200":
          description: Current scheduler timing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncTiming"
  /special-orders/product-lines:
    get:
      operationId: getSpecialOrderProductLines
      summary: Active product lines with a special-order item and types
      responses:
        "200":
          description: Available product lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecialOrderProductLine"
  /special-orders/product-lines/{productLineId}/types:
    get:
      operationId: getSpecialOrderTypes
      summary: Active special-order types for this product line
      parameters:
        - name: productLineId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: Product-line-specific choices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecialOrderType"
  /estimates/{estimateId}/add-items:
    post:
      operationId: addEstimateItems
      summary: Add catalog and special-order lines to an existing estimate
      parameters:
        - name: estimateId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateItemsInput"
      responses:
        "200":
          description: Added lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateItemsResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: Get category tree
      description: Returns the full 3-level category hierarchy
      responses:
        "200":
          description: Category tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryTreeResponse"
  /categories/{categoryId}/products:
    get:
      operationId: getCategoryProducts
      tags: [categories]
      summary: Get products for a category
      description: Returns products belonging to a specific category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /products/search:
    get:
      operationId: searchProducts
      tags: [products]
      summary: Search products
      description: Search products by name or SKU
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /netsuite/sync:
    post:
      operationId: triggerNetSuiteSync
      tags: [netsuite]
      summary: Trigger NetSuite sync
      description: Manually triggers a sync of categories and products from NetSuite
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
  /netsuite/status:
    get:
      operationId: getNetSuiteStatus
      tags: [netsuite]
      summary: Get NetSuite connection status
      description: Returns whether NetSuite credentials are configured
      responses:
        "200":
          description: NetSuite status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetSuiteStatus"
components:
  schemas:
    BrowserIssueLog:
      type: object
      required: [timestamp, level, message]
      properties:
        timestamp:
          type: string
          maxLength: 40
        level:
          type: string
          enum: [warn, error]
        message:
          type: string
          maxLength: 2000
    IssueReportInput:
      type: object
      required: [requestId, subject, detail, pageUrl, browserInfo, browserLogs]
      properties:
        requestId:
          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 300
        detail:
          type: string
          minLength: 1
          maxLength: 10000
        pageUrl:
          type: string
          maxLength: 2000
        browserInfo:
          type: string
          maxLength: 500
        browserLogs:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/BrowserIssueLog"
        screenshotPath:
          type: ["string", "null"]
          maxLength: 300
        captureError:
          type: ["string", "null"]
          maxLength: 300
    IssueReportResult:
      type: object
      required: [ok, reportId, caseId, caseNumber]
      properties:
        ok:
          type: boolean
        reportId:
          type: string
        caseId:
          type: string
        caseNumber:
          type: ["string", "null"]
    IssueScreenshotUpload:
      type: object
      required: [uploadUrl, objectPath]
      properties:
        uploadUrl:
          type: string
        objectPath:
          type: string
    AdminIssue:
      type: object
      required: [id, subject, detail, pageUrl, employeeName, createdAt, browserInfo, browserLogs, screenshotUrl, captureError, caseId, caseNumber, caseStatus, statusCheckedAt, submissionState, submissionError]
      properties:
        id:
          type: string
        subject:
          type: string
        detail:
          type: string
        pageUrl:
          type: string
        employeeName:
          type: string
        createdAt:
          type: string
        browserInfo:
          type: string
        browserLogs:
          type: array
          items:
            $ref: "#/components/schemas/BrowserIssueLog"
        screenshotUrl:
          type: ["string", "null"]
        captureError:
          type: ["string", "null"]
        caseId:
          type: ["string", "null"]
        caseNumber:
          type: ["string", "null"]
        caseStatus:
          type: ["string", "null"]
        statusCheckedAt:
          type: ["string", "null"]
        submissionState:
          type: string
        submissionError:
          type: ["string", "null"]
    AdminIssueList:
      type: object
      required: [items, total, page, pageSize, statusSyncError]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminIssue"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        statusSyncError:
          type: ["string", "null"]
    SyncTiming:
      type: object
      required: [nextSyncAt, enabled, syncing]
      properties:
        nextSyncAt:
          type: ["string", "null"]
        enabled:
          type: boolean
        syncing:
          type: boolean
    SpecialOrderProductLine:
      type: object
      required: [id, name, netsuiteItemId, sku, costMultiplier, retailMultiplier, crdMultiplier, categories]
      properties:
        id:
          type: string
        name:
          type: string
        netsuiteItemId:
          type: string
        sku:
          type: string
        logoUrl:
          type: string
          nullable: true
          description: NetSuite product-line logo image from custrecord_pl_logo
        websiteUrl:
          type: string
          nullable: true
          description: Vendor website from custrecord_pl_prd_website (the PRD page link); http(s) only
        categories:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
        costMultiplier:
          type: number
          description: Product line Cost Incl. Freight multiplier (custrecord_pl_costinclfreightmult); blank or zero is sent as 1, as NetSuite treats it
        retailMultiplier:
          type: number
          description: Product line Retail price multiplier (custrecord_pl_price_mult_retail); blank or zero is sent as 1
        crdMultiplier:
          type: number
          description: Product line CRD price multiplier (custrecord_pl_price_mult_crd); blank or zero is sent as 1
        types:
          type: array
          description: The product line's active special-order Types (for the Consumers Quote Helper)
          items:
            $ref: "#/components/schemas/SpecialOrderType"
    SpecialOrderType:
      type: object
      required: [id, name, requiresAttachment]
      properties:
        id:
          type: string
        name:
          type: string
        requiresAttachment:
          type: boolean
    SpecialOrderDetails:
      type: object
      required: [productLineId, productLineName, typeId, typeName, model, description, color, listPrice]
      properties:
        productLineId:
          type: string
          pattern: "^[1-9][0-9]*$"
        productLineName:
          type: string
          minLength: 1
          maxLength: 300
        typeId:
          type: string
          pattern: "^[1-9][0-9]*$"
        typeName:
          type: string
          minLength: 1
          maxLength: 300
        model:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          minLength: 1
          maxLength: 300
        color:
          type: string
          minLength: 1
          maxLength: 300
        listPrice:
          type: number
          minimum: 0
          maximum: 99999999
    EstimateLineInput:
      type: object
      required: [netsuiteId, quantity]
      properties:
        netsuiteId:
          type: string
          pattern: "^[1-9][0-9]*$"
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        specialOrder:
          $ref: "#/components/schemas/SpecialOrderDetails"
    EstimateItemsInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/EstimateLineInput"
    EstimateItemsResult:
      type: object
      required: [success, estimateId, tranId, itemsAdded, skippedNetsuiteIds]
      properties:
        success:
          type: boolean
        estimateId:
          type: integer
        tranId:
          type: string
        itemsAdded:
          type: integer
        skippedNetsuiteIds:
          type: array
          items:
            type: string
        specialOrderLines:
          type: array
          description: Special-order lines as priced on the estimate (list price x product line multipliers, as NetSuite does)
          items:
            $ref: "#/components/schemas/SpecialOrderLineResult"
    SpecialOrderLineResult:
      type: object
      required: [netsuiteId, model, quantity, listPrice, rate, amount]
      properties:
        netsuiteId:
          type: string
        model:
          type: string
        quantity:
          type: integer
        listPrice:
          type: number
        rate:
          type: number
        amount:
          type: number
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        level:
          type: integer
        parentId:
          type: integer
          nullable: true
        netsuiteId:
          type: string
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
        - id
        - name
        - level
        - parentId
        - netsuiteId
    CategoryTreeResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        usingMockData:
          type: boolean
      required:
        - categories
        - usingMockData
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        categoryId:
          type: integer
          nullable: true
        netsuiteId:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        fullImageUrl:
          type: string
          nullable: true
        quantityAvailable:
          type: integer
          nullable: true
        atpDate:
          type: string
          nullable: true
      required:
        - id
        - name
        - sku
        - price
        - categoryId
        - netsuiteId
        - imageUrl
        - fullImageUrl
        - quantityAvailable
    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        usingMockData:
          type: boolean
      required:
        - products
        - usingMockData
    SyncResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        categoriesSynced:
          type: integer
        productsSynced:
          type: integer
      required:
        - success
        - message
        - categoriesSynced
        - productsSynced
    NetSuiteStatus:
      type: object
      properties:
        connected:
          type: boolean
        accountId:
          type: string
          nullable: true
        lastSyncAt:
          type: string
          nullable: true
      required:
        - connected
        - accountId
        - lastSyncAt
